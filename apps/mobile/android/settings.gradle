pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
def cliBin = new File(settings.rootDir, "../../../node_modules/@react-native-community/cli/build/bin.js").canonicalFile
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
  ex.autolinkLibrariesFromCommand(
    ["C:\\Program Files\\nodejs\\node.exe", cliBin.toString(), "config"],
    file(".."),
    settings.layout.rootDirectory.dir("..").files("package-lock.json", "package.json", "react-native.config.js")
  )
}
rootProject.name = 'BlockJamCreator'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')
