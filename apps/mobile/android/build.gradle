buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
        nodeExecutableAndArgs = ["C:\\Program Files\\nodejs\\node.exe"]
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Redirect CMake .cxx intermediate dir to a short path to avoid Windows MAX_PATH issues
subprojects { subproject ->
    afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.library")) {
            subproject.android.externalNativeBuild.cmake.buildStagingDirectory = new File("C:\\bj-cxx\\${subproject.name}")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
